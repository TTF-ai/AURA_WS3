# AURA Emergency Alert System Parameters

alert_node:
  ros__parameters:
    # --- Telegram Settings ---
    telegram_enabled: true
    send_photo: true
    send_text_fallback: true
    test_telegram_on_startup: true

    # --- Location ---
    robot_location: "Living Room"

    # --- Retry & Timing ---
    max_retries: 3
    retry_delay_seconds: 2.0
    image_wait_timeout_seconds: 1.0

    # --- Image Capture ---
    image_quality: 85
    frame_buffer_seconds: 3.0

    # --- Cooldown ---
    alert_cooldown_seconds: 60.0
